name: Deploy Lambda Function

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --production

      - name: Create Lambda Entry Point
        run: |
          cat netlify/functions/api.js \
            | sed 's|../../src|./src|g' \
            | sed 's|../../config|./config|g' \
            > index.js

      - name: Create Deployment Package
        run: |
          zip -r code.zip . \
            -x ".git/*" \
            ".github/*" \
            "netlify/*" \
            "netlify.toml" \
            "*.md" \
            ".gitignore" \
            ".env*" \
            "deno.lock"

      - name: Set Lambda Function Name
        run: |
          if [ "$GITHUB_REF_NAME" = "development" ]; then
            echo "FUNCTION_NAME=${{ vars.DEVELOPMENT_LAMBDA_ARN }}" >> $GITHUB_ENV
          else
            echo "FUNCTION_NAME=${{ vars.PRODUCTION_LAMBDA_ARN }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://code.zip
